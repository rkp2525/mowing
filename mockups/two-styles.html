<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lawn Kid · Two worlds</title><style>
*{box-sizing:border-box}body{margin:0;background:#21372b;color:#ece8d2;font:15px/1.5 'Trebuchet MS',sans-serif}header{padding:24px 30px}h1{font-size:30px;margin:0 0 6px}p{margin:0;color:#bac9ad}a{color:#e4c99c}nav{display:flex;gap:24px;margin-top:12px;flex-wrap:wrap}main{padding:0 30px 30px;display:grid;gap:24px}section{background:#152b20;border-radius:12px;overflow:hidden}h2{padding:14px 20px;margin:0;font-size:20px}canvas{display:block;width:100%;height:auto}#status{margin-top:8px;font-size:12px}label{margin-left:auto}select{padding:5px;background:#e5dec5;color:#2e4731;font:inherit;border:0;border-radius:5px}
</style></head><body><header><h1>Same neighborhood. Two ways to see it.</h1><p>Fine Pixel keeps the original lush scenery. Textured Realism rebuilds the world in natural materials. These previews use the actual game renderers.</p><nav><a href="../index.html?level=1&art=pixel">Try Fine Pixel ↗</a><a href="../index.html?level=1&art=realism">Try Textured Realism ↗</a><label>Tool <select id="tool"><option value="scythe">Scythe</option><option value="reel">Reel mower</option><option value="gas">Gas mower</option><option value="ride">Riding mower</option></select></label></nav><p id="status">Loading artwork…</p></header><main><section><h2>Fine Pixel</h2><canvas id="pixel"></canvas></section><section><h2>Textured Realism</h2><canvas id="realism"></canvas></section></main>
<script src="../js/data.js"></script><script src="../js/groundskeeping.js"></script><script src="../js/precision.js"></script>
<script src="../js/sim.js"></script><script src="../js/sprites_nature.js"></script><script src="../js/sprites_player.js"></script><script src="../js/sprites_build.js"></script><script src="../js/render.js"></script><script src="../js/art-styles.js"></script><script>
const M=MOW,q=new URLSearchParams(location.search),select=document.querySelector('#tool');select.value=q.get('tool')||'scythe';let revision=0;
async function draw(){const request=++revision;const level=+(q.get('level')||1)-1;const s=M.Sim.create(level,{upgrades:{}},select.value);M.Render.bake(s);
s.p.heading=-.6;
// A few hand-cut stripes showcase the material difference without mowing flowers.
for(let y=0;y<s.H;y++)for(let x=0;x<s.W;x++){const i=y*s.W+x;if(s.grass[i]&&y>s.H*.57){s.grass[i]=0;s.dir[i]=x%6<3?1:2;}}
for(const style of ['pixel','realism']){await M.ArtStyles.setStyle(style);if(request!==revision)return;const cv=document.querySelector('#'+style);cv.width=1440;cv.height=760;const u=1440/Math.min(s.W*M.CELL,230);const cam={x:(s.W*M.CELL-1440/u)/2,y:Math.max(0,s.H*M.CELL-760/u-20)};M.Render.draw(cv.getContext('2d'),s,cam,cv.width,cv.height,u,1.4,{});}
document.querySelector('#status').textContent='Both styles loaded. Change styles in the game’s Settings; your preference is saved.';}
select.onchange=draw;draw().catch(e=>document.querySelector('#status').textContent=e.message);
</script></body></html>
