<!doctype html><html><head><meta charset="utf-8"><title>Gentle mowing review</title>
<style>body{margin:24px;background:#eee9d9;color:#294832;font:16px system-ui}h1{font-size:25px;margin-bottom:6px}main{display:flex;gap:20px}canvas{display:block;border-radius:12px}h2{font-size:18px}p{max-width:1180px}</style></head><body>
<h1>Gentle mowing · both art styles</h1><p>Alternating upward and downward passes use consistent shades. Flower patches show untouched, edge-clipped, and fully clipped stems. Clipping persists for the job.</p>
<main><section><h2>Fine Pixel</h2><canvas id="pixel" width="600" height="480"></canvas></section><section><h2>Textured Realism</h2><canvas id="realism" width="600" height="480"></canvas></section></main>
<p id="status">Loading…</p>
<script src="../js/data.js"></script><script src="../js/sim.js"></script><script src="../js/sprites_nature.js"></script><script src="../js/sprites_player.js"></script><script src="../js/sprites_build.js"></script><script src="../js/render.js"></script><script src="../js/art-styles.js"></script>
<script>
(async()=>{
 try{
 const M=MOW,s=M.Sim.create(0,{},'gas'),N=M.GRASS_SUBDIV**2;
 s.type = new Uint8Array(s.type.length).fill(M.T.GRASS);s.grass.fill(1);s.subGrass.fill(1);s.subRemaining.fill(N);s.remaining=s.total=s.grass.length;s.ents=[];
 const move=(x,y,h,mx,my)=>{s.p.x=x;s.p.y=y;s.p.heading=h;s.p.speed=0;for(let n=0;n<250;n++)M.Sim.step(s,{mx,my},1/120);};
 for(let lane=0;lane<5;lane++)move(13.3+lane*1.5,lane%2?7.5:19,lane%2?Math.PI/2:-Math.PI/2,0,lane%2?1:-1);
 // The same real blade interaction makes the flower examples.
 const flowers=[13.7,16.2,18.7].map(x=>{const e={t:'flower',x,y:11.3,color:0,alive:true};e.stems=M.flowerStems(e);return e;});s.ents=flowers;
 s.p.heading=0;s.p.speed=0;s.p.x=flowers[1].x-s.ts.r-.35;s.p.y=flowers[1].y-.95;M.Sim.step(s,{mx:0,my:0},1/120);
 s.p.x=flowers[2].x-s.ts.r-.35;s.p.y=flowers[2].y;M.Sim.step(s,{mx:0,my:0},1/120);s.p.x+=.1;M.Sim.step(s,{mx:0,my:0},1/120);s.p.x-=.2;M.Sim.step(s,{mx:0,my:0},1/120);
 s.p.x=18.4;s.p.y=15;s.p.heading=-Math.PI/2;s.p.speed=0;M.Render.bake(s);
 for(const style of ['pixel','realism']){await M.ArtStyles.setStyle(style);const cv=document.getElementById(style),g=cv.getContext('2d');M.Render.draw(g,s,{x:12*M.CELL,y:8*M.CELL},600,480,8,1,{footprint:false});}
 const counts=flowers.map(e=>e.stems.filter(stem=>stem.clipped).length);if(!(counts[0]===0&&counts[1]>0&&counts[1]<21&&counts[2]===21))throw Error('Unexpected flower damage: '+counts);
 document.getElementById('status').textContent='PASS · Flowers clipped: '+counts.join(' / ')+' stems of 21. Both production renderers loaded.';document.body.dataset.result='PASS';
 }catch(e){document.getElementById('status').textContent=e.stack;document.body.dataset.result='FAIL';}
})();
</script></body></html>
