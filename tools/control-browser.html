<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b5a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lawn Kid</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236fc24b'/%3E%3Crect y='8' width='32' height='6' fill='%2386d557'/%3E%3Crect y='20' width='32' height='6' fill='%2386d557'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23d94a2b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="hud-tool" class="chip tool-chip" title="Truck equipment (Q/E)"><span id="hud-tool-icon">🛞</span><span id="hud-tool-name">Push Reel Mower</span></button>
      <div class="cov-wrap">
        <div class="cov-bar"><div id="cov-fill"></div><div class="cov-mark" style="left:80%"></div></div>
        <div class="cov-text"><span id="cov-pct">0%</span> mowed · <span id="cov-time">0:00</span></div>
      </div>
      <div class="hud-right">
        <div class="chip" id="hud-time">0:00</div>
        <button id="hud-lock" class="chip icon-btn" title="Straight-line lock (Shift / L)">↔</button>
        <button id="hud-zoom" class="chip icon-btn" title="Zoom (+/-)">🔍</button>
        <button id="hud-pause" class="chip icon-btn" title="Pause (Esc)">⏸</button>
      </div>
    </div>
    <div class="meter-wrap"><div class="meter-label" id="meter-label">Stamina</div><div class="meter"><div id="meter-fill"></div></div></div>
    <div id="grounds-status" class="chip grounds-status" role="status"></div>
    <button id="btn-fertilize" class="big-btn grounds-action hidden">Scatter · Space</button>
    <div id="hint" class="hint hidden"></div>
    <button id="btn-finish" class="big-btn finish hidden">✔ Finish Job</button>
    <div id="touch-ui">
      <div id="joy-base"><div id="joy-knob"></div></div>
    </div>
  </div>

  <div id="screens"></div>
  <div id="toast" class="hidden"></div>
</div>
<script src="../js/data.js"></script>
<script src="../js/groundskeeping.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/bot.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/sprites_nature.js"></script>
<script src="../js/sprites_player.js"></script>
<script src="../js/sprites_build.js"></script>
<script src="../js/render.js"></script>
<script src="../js/art-styles.js"></script>
<script src="../js/main.js"></script>
<script src="browser-controls.js"></script></body>
</html>
